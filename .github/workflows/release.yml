name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual build, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MSI
        shell: bash
        run: ./gradlew --no-daemon --console=plain -Pversion=${{ steps.version.outputs.value }} -Dorg.gradle.java.home="$JAVA_HOME" packageMsi

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p dist
          cp build/compose/binaries/main/msi/*.msi dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.msi
          generate_release_notes: true
